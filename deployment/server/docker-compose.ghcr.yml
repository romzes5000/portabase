# Прод: /opt/portabase/docker-compose.yml — образы GHCR org Oxem-Studio, тег из .env.deploy (IMAGE_TAG).
name: portabase
services:
  portabase:
    image: ghcr.io/oxem-studio/portabase:${IMAGE_TAG}
    container_name: portabase-app
    restart: always
    env_file: .env
    ports:
      - "127.0.0.1:8887:80"
      - "100.72.173.25:5432:5433"
    volumes:
      - portabase-data:/data
    mem_limit: 768m
    memswap_limit: 1536m

  pg-netbird:
    image: ghcr.io/oxem-studio/portabase:${IMAGE_TAG}
    network_mode: "service:portabase"
    depends_on:
      - portabase
    restart: unless-stopped
    command:
      - sh
      - -c
      - "apk add --no-cache socat >/dev/null && exec socat TCP-LISTEN:5433,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:5432"

  portabase-agent-self:
    image: ghcr.io/oxem-studio/portabase:${IMAGE_TAG}
    container_name: portabase-agent-self
    restart: always
    network_mode: "service:portabase"
    env_file:
      - /opt/portabase-agent-self/.env
    volumes:
      - /opt/portabase-agent-self/databases.json:/config/config.json:ro
    depends_on:
      - portabase

volumes:
  portabase-data:
