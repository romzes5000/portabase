# Триггерит Oxem-Studio/portabase-deploy при push в oxem/deploy (сборка + SSH-деплой).
# Нужен секрет OXEM_DEPLOY_WORKFLOW_DISPATCH_TOKEN — см. docs/fork-workflow.md

name: Dispatch Oxem deploy

on:
  push:
    branches:
      - oxem/deploy

concurrency:
  group: oxem-deploy-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.repository == 'romzes5000/portabase'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch portabase-deploy (build + deploy_to_server)
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.sha }}
          DISPATCH_TOKEN: ${{ secrets.OXEM_DEPLOY_WORKFLOW_DISPATCH_TOKEN }}
        with:
          github-token: ${{ secrets.OXEM_DEPLOY_WORKFLOW_DISPATCH_TOKEN }}
          script: |
            if (!process.env.DISPATCH_TOKEN) {
              core.setFailed('Секрет OXEM_DEPLOY_WORKFLOW_DISPATCH_TOKEN не задан. См. docs/fork-workflow.md');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: 'Oxem-Studio',
              repo: 'portabase-deploy',
              workflow_id: 'build-and-deploy.yml',
              ref: 'main',
              inputs: {
                ref: process.env.TARGET_SHA,
                deploy_to_server: 'true',
                use_self_hosted: 'true',
              },
            });
